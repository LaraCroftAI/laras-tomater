name: Tester

# Kör testerna för receptens satsberäkning vid varje push och pull request.
# Testerna läser funktionerna direkt ur app.js, så de fångar om en ändring där
# får mängderna att räknas om fel.
#
# OBS: Vercel deployar oberoende av det här jobbet. Ett rött kryss stoppar
# alltså inte publiceringen – det syns i commit-listan och måste läsas där.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {} # går även att köra manuellt

jobs:
  satsberakning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Satsberäkning
        run: node test/batch.test.mjs

      # REQUIRE_BROWSER gör att jobbet failar om ingen webbläsare hittas, i stället
      # för att testet hoppar över sig självt och lyser grönt utan att ha kört.
      - name: Dialoger i webbläsare
        run: node test/dialog.browser.test.mjs
        env:
          REQUIRE_BROWSER: "1"
